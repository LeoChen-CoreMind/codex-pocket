name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-bridge:
    name: Windows Bridge
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install Bridge dependencies
        working-directory: bridge
        run: npm.cmd ci

      - name: Build static Windows executable
        working-directory: bridge-control
        run: .\build-static.ps1

      - name: Verify Windows artifact
        run: |
          $artifact = '.\bridge-control\publish-static\CodexPocketBridge.exe'
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Windows artifact was not produced: $artifact"
          }
          Get-Item -LiteralPath $artifact | Select-Object FullName, Length, LastWriteTime
          Get-FileHash -LiteralPath $artifact -Algorithm SHA256

      - name: Upload Windows Bridge
        uses: actions/upload-artifact@v4
        with:
          name: CodexPocketBridge-Windows-x64
          path: bridge-control/publish-static/CodexPocketBridge.exe
          if-no-files-found: error
          retention-days: 14

  android-app:
    name: Android APP
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build Android debug APK
        working-directory: mobile
        run: .\gradlew.bat :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Android artifact
        run: |
          $artifact = '.\mobile\app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Android artifact was not produced: $artifact"
          }
          Get-Item -LiteralPath $artifact | Select-Object FullName, Length, LastWriteTime
          Get-FileHash -LiteralPath $artifact -Algorithm SHA256

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CodexPocket-Android-Debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
